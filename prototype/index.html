<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Mosaic Connected Manual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: three-pane tool (navigator · reader · detail panel) under the MOSAIC navy slab; bottom sheet on phones.
   Tokens follow the MOSAIC design system (blues lead; terracotta = documents, saffron = warnings/AI, majolica = errors). */
:root {
  --bg: #F4F7FB; --surface: #FFFFFF; --sunk: #EAF2FB; --line: #C9DCF0;
  --ink: #1B2A3D; --ink-2: #3B4B5F; --ink-3: #3B4B5F; --heading: #0A2A5C;
  --brand: #0A2A5C; --brand-2: #163C78; --brand-ink: #FFFFFF; --brand-ink-2: #CFE2F6; --brand-line: #2F6DB5; --brand-field: #0B2E63;
  --mark-a: #FFFFFF; --mark-b: #9CC3E8; --mark-c: #6FA8DC;
  --accent: #2F6DB5; --accent-bg: #DCE9F7;
  --cur: #CFE2F6; --cur-ink: #0A2A5C; --cur-line: #2F6DB5;
  --doc: #C8622A; --doc-bg: #F8E1D2; --doc-ink: #A44E1C;
  --warn: #E0A21F; --warn-bg: #FCEFCF; --warn-ink: #7A5A0E;
  --err: #B3392B; --err-bg: #F6DAD5; --err-ink: #8E2B20;
  --edge: #9CB3CF; --node-c-bg: #0A2A5C; --node-c-ink: #FFFFFF;
  --t-kw: #0A2A5C; --t-com: #3B4B5F; --t-pre: #2F6DB5;
  --font-ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A2A5C; --surface: #0C3168; --sunk: #123A75; --line: #1F5296;
  --ink: #E6EEF8; --ink-2: #9CC3E8; --ink-3: #9CC3E8; --heading: #FFFFFF;
  --brand: #061733; --brand-2: #163C78; --brand-ink: #FFFFFF; --brand-ink-2: #CFE2F6; --brand-line: #1F5296; --brand-field: #0C3168;
  --accent: #6FA8DC; --accent-bg: #163C78;
  --cur: #2F6DB5; --cur-ink: #FFFFFF; --cur-line: #9CC3E8;
  --doc: #C8622A; --doc-bg: #6E3412; --doc-ink: #F8E1D2;
  --warn: #F2B630; --warn-bg: #5C430A; --warn-ink: #FCEFCF;
  --err: #F6DAD5; --err-bg: #5E1C15; --err-ink: #F6DAD5;
  --edge: #3D7FC9; --node-c-bg: #CFE2F6; --node-c-ink: #0A2A5C;
  --t-kw: #FFFFFF; --t-com: #9CC3E8; --t-pre: #6FA8DC;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A2A5C; --surface: #0C3168; --sunk: #123A75; --line: #1F5296;
  --ink: #E6EEF8; --ink-2: #9CC3E8; --ink-3: #9CC3E8; --heading: #FFFFFF;
  --brand: #061733; --brand-2: #163C78; --brand-ink: #FFFFFF; --brand-ink-2: #CFE2F6; --brand-line: #1F5296; --brand-field: #0C3168;
  --accent: #6FA8DC; --accent-bg: #163C78;
  --cur: #2F6DB5; --cur-ink: #FFFFFF; --cur-line: #9CC3E8;
  --doc: #C8622A; --doc-bg: #6E3412; --doc-ink: #F8E1D2;
  --warn: #F2B630; --warn-bg: #5C430A; --warn-ink: #FCEFCF;
  --err: #F6DAD5; --err-bg: #5E1C15; --err-ink: #F6DAD5;
  --edge: #3D7FC9; --node-c-bg: #CFE2F6; --node-c-ink: #0A2A5C;
  --t-kw: #FFFFFF; --t-com: #9CC3E8; --t-pre: #6FA8DC;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code, .mono { font-family: var(--font-mono); }

/* Top bar */
.top { background: var(--brand); color: var(--brand-ink); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top :focus-visible { outline-color: var(--brand-ink); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: 0 0 auto; }
.b-name { font-weight: 700; font-size: 17px; letter-spacing: .04em; }
.b-sep { width: 1px; height: 18px; background: var(--brand-line); }
.b-proj { font: 600 13px var(--font-mono); }
.b-view { font-size: 13px; color: var(--brand-ink-2); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.hbtn { background: transparent; border: 1px solid var(--brand-line); color: var(--brand-ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; line-height: 1.3; }
.hbtn:hover { background: var(--brand-2); }
.hbtn[aria-disabled="true"] { color: var(--brand-ink-2); cursor: default; }
.hbtn[aria-disabled="true"]:hover { background: transparent; }
.search { display: flex; align-items: center; gap: 6px; background: var(--brand-field); border: 1px solid var(--brand-line); border-radius: 6px; padding: 0 8px; min-width: 0; }
.search input { background: transparent; border: 0; color: var(--brand-ink); width: 240px; max-width: 100%; padding: 6px 0; font: inherit; outline: none; }
.search input::placeholder { color: var(--brand-ink-2); }
.search:focus-within { border-color: var(--brand-ink-2); }
.search kbd { font: 11px var(--font-mono); color: var(--brand-ink-2); border: 1px solid var(--brand-line); border-radius: 4px; padding: 0 5px; }
.diagbtn { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.err { background: #B3392B; box-shadow: 0 0 0 1px var(--brand-ink); } .dot.warn { background: #F2B630; }
.nav-only { display: none; }

/* Panes */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr) 360px; gap: 12px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav, .reader, .panel { min-height: 0; overflow: auto; }
.reader, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

/* Navigator */
.nav { padding: 2px 2px 16px; display: flex; flex-direction: column; gap: 14px; }
.ng h2 { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px 10px; font-weight: 600; }
.ng.doc h2 { color: var(--doc-ink); }
.ni { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.ni:hover { background: var(--sunk); }
.ni[aria-current="true"] { background: var(--accent-bg); color: var(--heading); }
.ni .l { display: block; font-size: 13.5px; font-weight: 550; }
.ni .s { display: block; font-size: 12px; color: var(--ink-3); }
.ni[aria-current="true"] .s { color: var(--ink-2); }
.ni.child { padding-left: 22px; font-size: 12.5px; }
.ni.child .l { font-weight: 450; font-size: 12.5px; }
.note { margin: 4px 10px 0; font-size: 12px; color: var(--ink-3); line-height: 1.45; }

/* Reader */
.rh { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px 12px; display: flex; flex-direction: column; gap: 2px; }
.rh .kind { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.rh.doc .kind { color: var(--doc-ink); }
.rh h1 { font-size: 19px; margin: 0; font-weight: 700; color: var(--heading); text-wrap: balance; }
.rh .sub { color: var(--ink-2); }
.rh .file { font: 12px var(--font-mono); color: var(--ink-3); }
[data-scope], [data-unit], [data-mid] { scroll-margin-top: 96px; }

.code { font: 13px/1.65 var(--font-mono); padding: 8px 0 24px; overflow-x: auto; }
.code-in { display: inline-block; min-width: 100%; }
.ln { display: flex; }
.ln .no { flex: 0 0 3.6em; text-align: right; padding-right: 14px; color: var(--ink-3); user-select: none; }
.ln code { white-space: pre; font: inherit; padding-right: 20px; }
.t-kw { color: var(--t-kw); font-weight: 600; } .t-com, .t-doc { color: var(--t-com); font-style: italic; } .t-pre, .t-dec { color: var(--t-pre); }
.code .xrefs { padding: 10px 20px 4px 3.6em; margin-left: 14px; }

.doc { padding: 6px 24px 40px; max-width: 78ch; }
.doc section { padding-top: 10px; }
.doc h2, .doc h3 { margin: 14px 0 6px; text-wrap: balance; }
.doc h2 { font-size: 17px; font-weight: 700; color: var(--heading); }
.doc h3 { font-size: 15px; font-weight: 700; color: var(--heading); }
.secno { font: 600 0.92em var(--font-mono); color: var(--ink-3); margin-right: 6px; }
.doc p { margin: 6px 0 10px; line-height: 1.6; }
.tw { overflow-x: auto; margin: 8px 0 14px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); background: var(--sunk); padding: 6px 10px; white-space: nowrap; }
td { padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.doc .xrefs { margin: 2px 0 8px; }

/* Mentions */
.m { background: none; border: 0; padding: 0 1px; margin: 0 -1px; border-radius: 3px; color: var(--accent); cursor: pointer;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; font: inherit; }
.m:hover { background: var(--accent-bg); }
.m.cur { background: var(--cur); color: var(--cur-ink); text-decoration: none; box-shadow: 0 0 0 1px var(--cur-line); font-weight: 600; }
.m-bad { text-decoration: underline dashed var(--warn); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; border-radius: 3px; }
.m-bad.err { text-decoration-color: var(--err); }
.m-bad:hover, .m-bad:focus-visible { background: var(--warn-bg); color: var(--warn-ink); }
.m-bad.err:hover, .m-bad.err:focus-visible { background: var(--err-bg); color: var(--err-ink); }
.flash { animation: flash 1.8s ease-out; }
@keyframes flash { from { background: var(--cur); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; background: var(--accent-bg); } }

/* Cross-reference chips */
.xrefs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 12px/1.4 var(--font-ui); }
.xk { color: var(--ink-3); }
.xk:not(:first-child) { margin-left: 6px; }
.chip { background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; color: var(--ink); font-size: 12px; }
.chip { background: var(--accent-bg); border-color: transparent; color: var(--heading); }
.chip.doc { background: var(--doc-bg); border: 1px dashed var(--doc); color: var(--doc-ink); }
.chip:hover { border-color: var(--accent); }
.chip.doc:hover { border-style: solid; }

/* Detail panel */
.panel { padding-bottom: 16px; }
.ph { padding: 14px 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.ph-top { display: flex; align-items: center; justify-content: space-between; }
.pill { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--heading); background: var(--accent-bg); border-radius: 4px; padding: 2px 8px; }
.x { background: none; border: 1px solid transparent; border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; }
.x:hover { border-color: var(--line); }
.pk { font: 600 21px var(--font-mono); margin: 6px 0 0; color: var(--heading); }
.pm { font: 13.5px var(--font-mono); color: var(--ink-2); }
.pd { margin: 4px 0 0; color: var(--ink-2); }
.pg { border-top: 1px solid var(--line); padding: 10px 12px 4px; }
.pg h3 { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); margin: 2px 6px 6px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.cnt { color: var(--ink-3); font-weight: 500; letter-spacing: 0; }
.dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; margin: 0 6px 6px; }
.dl dt { color: var(--ink-2); font-size: 13px; }
.dl dt code { display: block; font-size: 11px; color: var(--ink-3); }
.dl dd { margin: 0; font: 13px var(--font-mono); align-self: center; }
.rel-t { margin: 0 6px 6px; font-size: 13px; color: var(--ink-2); }
.ri, .mi { display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; }
.ri:hover, .mi:hover { background: var(--sunk); }
.ri-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ri-k { font: 600 13px var(--font-mono); color: var(--accent); }
.res .mi-snip { padding-left: 0; }
.ri-m { font: 12.5px var(--font-mono); color: var(--ink-2); }
.ri-s { font-size: 12px; color: var(--ink-3); }
.mi-loc { font-size: 13px; color: var(--heading); font-weight: 500; display: flex; gap: 6px; align-items: center; }
.mi-loc svg { flex: 0 0 auto; color: var(--accent); }
.mi-loc.doc svg { color: var(--doc); }
.mi-snip { font: 12px/1.45 var(--font-mono); color: var(--ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mi-snip mark { background: var(--cur); color: var(--cur-ink); border-radius: 2px; padding: 0 1px; }
.mi-snip { padding-left: 20px; }
.mi-n { font-size: 12px; color: var(--ink-3); }
.empty { padding: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 12px; }
.empty h2 { font-size: 15px; margin: 0; color: var(--ink); }
.legend { display: grid; gap: 8px; font-size: 13px; }
.legend div { display: flex; gap: 10px; align-items: baseline; }
.legend .ex { flex: 0 0 92px; font-family: var(--font-mono); }

/* Tables, search, diagnostics in the main pane */
.pad { padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.filter { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: inherit; width: 260px; max-width: 100%; }
.sortb { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 600; color: var(--ink-2); }
.sortb small { display: block; font: 10.5px var(--font-mono); color: var(--ink-3); font-weight: 400; }
tr[data-row-ent] { cursor: pointer; }
tr[data-row-ent]:hover td { background: var(--sunk); }
tr[aria-selected="true"] td { background: var(--accent-bg); }
td.mono { font-family: var(--font-mono); }
.cell-link { background: none; border: 0; padding: 0; color: var(--accent); font: 600 13px var(--font-mono); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.res h2 { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); margin: 6px 0 4px; font-weight: 600; }
.res .mi, .res .ri { border: 1px solid var(--line); margin-bottom: 6px; }
.dg { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.dg[aria-current="true"] { border-color: var(--warn); }
.sev { font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; align-self: flex-start; }
.sev.err { color: var(--err-ink); background: var(--err-bg); } .sev.warn { color: var(--warn-ink); background: var(--warn-bg); }
.dg .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.muted { color: var(--ink-3); }

/* Connections graph: defined and described on the left, used and mentioned on the right */
.graph { position: relative; margin: 0 6px 6px; }
.graph svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.ge { stroke: var(--edge); stroke-width: 1.5; fill: none; vector-effect: non-scaling-stroke; }
.ge.doc { stroke: var(--doc); stroke-dasharray: 4 3; }
.gh { position: absolute; top: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.gn { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 0 8px;
  border-radius: 6px; border: 1px solid var(--accent); background: var(--accent-bg); color: var(--heading); font: 11.5px/1.15 var(--font-ui); text-align: left; cursor: pointer; overflow: hidden; }
.gn .gl { font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.gn .gs { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gn.ent .gl { font-family: var(--font-mono); font-weight: 600; }
.gn.doc { border-style: dashed; border-color: var(--doc); background: var(--doc-bg); color: var(--doc-ink); }
.gn.doc .gs { color: var(--doc-ink); }
.gn.more { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
.gn:hover, .gn:focus-visible { box-shadow: 0 0 0 2px var(--cur-line); outline: none; }
.gn.gc { background: var(--node-c-bg); color: var(--node-c-ink); border: 0; align-items: center; text-align: center; cursor: default; font: 600 12.5px/1.2 var(--font-mono); }
.gn.gc:hover { box-shadow: none; }
.big .gn { font-size: 13px; padding: 0 12px; } .big .gn.gc { font-size: 15px; }
.glegend { display: flex; flex-wrap: wrap; gap: 12px; margin: 2px 6px 8px; font-size: 12px; color: var(--ink-2); align-items: center; }
.glegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--accent); background: var(--accent-bg); }
.glegend i.doc { border: 1px dashed var(--doc); background: var(--doc-bg); }
.linkbtn { margin-left: auto; background: none; border: 0; color: var(--accent); cursor: pointer; font: 600 12px var(--font-ui); text-decoration: underline; text-underline-offset: 2px; padding: 0; letter-spacing: 0; text-transform: none; }
.bigwrap { max-width: 900px; }
/* Entity page */
body.page-mode .main { grid-template-columns: 236px minmax(0, 1fr); }
.rh .mono { font-family: var(--font-mono); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: var(--sunk); border-radius: 6px; padding: 4px 10px; font-size: 13px; color: var(--ink-2); }
.stat b { color: var(--heading); font-weight: 600; margin-left: 4px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px 24px; align-items: start; }
.pcol { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.psec h2 { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; font-weight: 600; display: flex; gap: 6px; }
.psec .tw { margin: 0; }
.psec th[scope="row"] { background: transparent; color: var(--ink-2); font-weight: 500; width: 45%; white-space: normal; }
th small { display: block; font: 400 10.5px var(--font-mono); color: var(--ink-2); }
.psec .mi { border: 1px solid var(--line); margin-bottom: 6px; }
.psec .mi-snip { -webkit-line-clamp: 3; }
.ph-acts { display: flex; align-items: center; gap: 10px; }

@media (max-width: 1199px) and (min-width: 900px) {
  .main { grid-template-columns: 200px minmax(0, 1fr) 312px; }
  body.page-mode .main { grid-template-columns: 200px minmax(0, 1fr); }
}
@media (max-width: 899px) {
  .nav-only { display: inline-block; }
  .tools { margin-left: 0; width: 100%; }
  .search { flex: 1; }
  .search input { width: 100%; }
  .search kbd { display: none; }
  .main, body.page-mode .main { grid-template-columns: minmax(0, 1fr); }
  .nav { display: none; }
  body.nav-open .nav { display: flex; }
  body.nav-open .reader { display: none; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 60%; z-index: 20; border-radius: 14px 14px 0 0; border-bottom: 0;
    box-shadow: 0 -8px 28px rgba(5, 15, 30, .22);
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
  .doc { padding-inline: 16px; }
  .rh { padding-inline: 16px; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">

`/* pwr_app.c - power application: telecommands and housekeeping */
#include "demosat_ids.h"
#include "pwr_app.h"

/* Heater control. Mode 1 = thermostat, 2 = forced on (PWRP0001). */
static int pwr_heater_set(heater_t h, uint8_t mode)
{
    if (mode < 1u || mode > 2u) {
        return PWR_ERR_RANGE;
    }
    return htr_drv_set(h, mode);
}

/* Dispatch PUS (8,1) function-management TCs addressed to PWR. */
int pwr_tc_dispatch(tc_id_t tc_id, const tc_args_t *args)
{
    switch (tc_id) {
    case TC_PWRC0101:   /* PWR_HTR_A_ON */
        return pwr_heater_set(HEATER_A, args->u8[0]);
    case TC_PWRC0102:   /* PWR_HTR_A_OFF */
        return htr_drv_off(HEATER_A);
    case TC_PWRC0110:   /* PWR_SET_BAT_EOC, volts in PWRP0010 */
        return bcr_set_eoc(args->f32[0]);
    default:
        return PWR_ERR_UNKNOWN_TC;
    }
}

/* Fill the PWR_HK packet, PUS (3,25). */
void pwr_hk_fill(hk_buf_t *buf)
{
    hk_put_u16(buf, PARAM_PWRT0012, adc_read(ADC_BAT_V));
    hk_put_u16(buf, PARAM_PWRT0013, adc_read(ADC_BAT_I));
    hk_put_u16(buf, PARAM_PWRT0020, adc_read(ADC_BAT_T1));
    hk_put_bit(buf, PARAM_PWRT0031, htr_drv_state(HEATER_A));
    hk_put_bit(buf, PARAM_PWRT0032, htr_drv_state(HEATER_B));
    hk_put_u16(buf, PARAM_PWRT0040, adc_read(ADC_SA_I));
}` }

      <span class="acts"><button class="chip" data-go-mid="${m.id}">Open location</button>${d.sugg.length ? `<span>Did you mean</span>` + d.sugg.map(s => `<button class="chip" data-ent="${s.type}|${s.key}">${s.key}</button>`).join("") : ""}</span></div>`;
  }
  return h + `</div>`;
}
function navHTML() {
  const mm = state.main;
  const item = (go, label, sub, child) => {
    const cur = go.kind === mm.kind && (go.kind === "table" ? go.type === mm.type : go.id === mm.id) && (child ? mm.scope === go.scope : true);
    return `<button class="ni${child ? " child" : ""}" data-nav='${esc(JSON.stringify(go))}'${cur && !(child === false && mm.scope) ? ' aria-current="true"' : ""}><span class="l">${esc(label)}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ""}</button>`;
  };
  const docGroup = (title, id) => {
    const s = SRC_BY[id];
    return `<div class="ng doc"><h2>${title}</h2>${item({ kind: "src", id }, s.file.split("/").pop(), s.sub, false)}${s.sections.filter(x => x.level === 2).map(x => item({ kind: "src", id, scope: `${id}#${x.num}` }, `${x.num} ${x.title}`, "", true)).join("")}</div>`;
  };
  return `<div class="ng"><h2>Procedures</h2>${["fop1", "fop2"].map(id => item({ kind: "src", id }, SRC_BY[id].title, SRC_BY[id].sub)).join("")}</div>` +
    docGroup("SW user manual", "sum") + docGroup("SW ICD", "icd") +
    `<div class="ng"><h2>SRDB</h2>${["PCF", "CCF", "CPC", "PID", "PLF"].map(t => { const c = tableConf(t); return item({ kind: "table", type: t }, c.plural, `${c.file} \u00b7 ${tableRows(t).length} rows`); }).join("")}</div>` +
    `<div class="ng"><h2>SCSW code</h2>${["hdr", "app"].map(id => item({ kind: "src", id }, SRC_BY[id].title, SRC_BY[id].file.replace(/[^/]+$/, ""))).join("")}</div>` +
    `<p class="note">Prototype with invented sample data from the DEMOSAT-1 mock mission. Two seeded defects: a typo in the manual and a TC that is no longer in the SRDB.</p>`;
}
function group(title, body, count) {
  return `<section class="pg"><h3>${title}${count != null ? `<span class="cnt">${count}</span>` : ""}</h3>${body}</section>`;
}
function entBtn(type, key, sub) {
  const T = TYPES[type], a = ENT[type][key];
  return `<button class="ri" data-ent="${type}|${key}"><span class="ri-row"><span class="ri-k">${esc(a[T.id])}</span><span class="ri-m">${esc(a[T.mn] || "")}</span></span>${sub ? `<span class="ri-s">${esc(sub)}</span>` : ""}</button>`;
}
function emptyPanel() {
  return `<div class="empty"><h2>Pick an item</h2><p>Select a highlighted ID or mnemonic to see its SRDB definition and every place it appears.</p>
  <div class="legend"><div><span class="ex"><span class="m">PWRC0101</span></span><span>Linked to the SRDB</span></div>
  <div><span class="ex"><span class="m-bad">PWRT0O12</span></span><span>Looks like an ID, matches nothing</span></div>
  <div><span class="ex"><span class="chip doc">SUM 4.2</span></span><span>Cross-reference to another source</span></div></div></div>`;
}
function renderPanel() {
  const p = $("#panel");
  if (state.main.kind === "entity") { p.hidden = true; return; }
  if (!state.ent) { p.innerHTML = emptyPanel(); p.hidden = narrowMq.matches; return; }
  p.hidden = false;
  const { type, key } = state.ent, T = TYPES[type], a = ENT[type][key];
  let h = `<div class="ph"><div class="ph-top"><span class="pill">${T.label}</span><span class="ph-acts"><button class="linkbtn" data-page="1">Open page</button><button class="x" id="pclose" aria-label="Close details">\u00d7</button></span></div>
    <h2 class="pk">${esc(a[T.id])}</h2><div class="pm">${esc(a[T.mn] || "")}</div><p class="pd">${esc(a[T.desc] || "")}</p></div>`;
  h += group(`Connections<button class="linkbtn" data-graph="1">Expand</button>`, graphHTML(type, key, false));
  h += group("Definition", `<dl class="dl">${T.defs.map(c => `<dt>${COL[c]}<code>${c}</code></dt><dd>${esc(a[c] || "\u2014")}</dd>`).join("")}</dl>`);
  if (type === "PCF") {
    h += group("Calibration", `<div class="rel-t">${esc(CAL[a.PCF_CURTX] || "None")}</div>`);
    const pl = PLF.filter(r => r[0] === key);
    h += group("In packets", pl.map(r => entBtn("PID", r[1], `byte ${r[2]}, bit ${r[3]}`)).join("") || `<div class="rel-t">None</div>`, pl.length);
    if (OCF[key]) h += group("Limit checks", `<div class="rel-t">${esc(OCF[key])}</div>`);
  } else if (type === "CCF") {
    const ar = CDF.filter(r => r[0] === key);
    h += group("Arguments", ar.map(r => entBtn("CPC", r[2], ENT.CPC[r[2]].CPC_LDESCR)).join("") || `<div class="rel-t">None</div>`, ar.length);
  } else if (type === "CPC") {
    const us = CDF.filter(r => r[2] === key);
    h += group("Used by telecommands", us.map(r => entBtn("CCF", r[0], ENT.CCF[r[0]].CCF_DESCR2)).join(""), us.length);
  } else if (type === "PID") {
    const fl = PLF.filter(r => r[1] === key);
    h += group("Fields", fl.map(r => entBtn("PCF", r[0], `byte ${r[2]}, bit ${r[3]}`)).join(""), fl.length);
  }
  const ms = OK.filter(m => m.type === type && m.key === key);
  for (const [role, title] of GROUPS) {
    const list = ms.filter(m => m.role === role); if (!list.length) continue;
    const by = new Map(); for (const m of list) { if (!by.has(m.scope)) by.set(m.scope, []); by.get(m.scope).push(m); }
    h += group(title, [...by].map(([sc, arr]) => `<button class="mi" data-go-mid="${arr[0].id}"><span class="mi-loc${isDocScope(sc) ? " doc" : ""}">${scopeIcon(sc)}${esc(SCOPES.get(sc).full)}</span><span class="mi-snip">${snippet(arr[0])}</span>${arr.length > 1 ? `<span class="mi-n">${arr.length} places in this ${SCOPES.get(sc).kind === "section" ? "section" : SCOPES.get(sc).kind}</span>` : ""}</button>`).join(""), list.length);
  }
  p.innerHTML = h;
}
function sec(title, body, count) {
  return `<section class="psec"><h2>${title}${count != null ? `<span class="cnt">${count}</span>` : ""}</h2>${body}</section>`;
}
function tbl(head, rows) {
  return `<div class="tw"><table><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
const link = (t, k, text) => `<button class="cell-link" data-ent="${t}|${k}">${esc(text || k)}</button>`;
function renderEntityPage(type, key) {
  const T = TYPES[type], a = ENT[type][key];
  const ms = OK.filter(m => m.type === type && m.key === key);
  let left = sec("Definition", `<div class="tw"><table><tbody>${[...new Set([...T.cols, ...T.defs])].map(c =>
    `<tr><th scope="row">${COL[c]}<small>${c}</small></th><td class="mono">${esc(a[c] || "\u2014")}</td></tr>`).join("")}</tbody></table></div>`);
  if (type === "PCF") {
    const pl = PLF.filter(r => r[0] === key);
    left += sec("In packets", pl.length ? tbl(["Packet", "SPID", "Byte", "Bit"], pl.map(r => `<tr><td>${link("PID", r[1], ENT.PID[r[1]].TPCF_NAME)}</td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td></tr>`)) : `<p class="muted">In no packet.</p>`, pl.length);
    left += sec("Calibration", `<p>${esc(CAL[a.PCF_CURTX] || "None")}</p>`);
    if (OCF[key]) left += sec("Limit checks", `<p>${esc(OCF[key])}</p>`);
  } else if (type === "CCF") {
    const ar = CDF.filter(r => r[0] === key);
    left += sec("Arguments", ar.length ? tbl(["Bit", "Argument", "Mnemonic", "PTC/PFC", "Unit", "Description"], ar.map(r => { const c = ENT.CPC[r[2]];
      return `<tr><td class="mono">${r[1]}</td><td>${link("CPC", r[2])}</td><td class="mono">${esc(c.CPC_DESCR)}</td><td class="mono">${c.CPC_PTC}/${c.CPC_PFC}</td><td class="mono">${esc(c.CPC_UNIT || "")}</td><td>${esc(c.CPC_LDESCR)}</td></tr>`; })) : `<p class="muted">No arguments.</p>`, ar.length);
  } else if (type === "CPC") {
    const us = CDF.filter(r => r[2] === key);
    left += sec("Used by telecommands", tbl(["TC", "Mnemonic", "Description"], us.map(r => { const c = ENT.CCF[r[0]];
      return `<tr><td>${link("CCF", r[0])}</td><td class="mono">${esc(c.CCF_DESCR)}</td><td>${esc(c.CCF_DESCR2)}</td></tr>`; })), us.length);
  } else if (type === "PID") {
    const fl = PLF.filter(r => r[1] === key).slice().sort((x, y) => (+x[2] - +y[2]) || (+x[3] - +y[3]));
    left += sec("Packet layout", tbl(["Byte", "Bit", "Parameter", "Mnemonic", "Unit", "Description"], fl.map(r => { const c = ENT.PCF[r[0]];
      return `<tr><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td><td>${link("PCF", r[0])}</td><td class="mono">${esc(c.PCF_DESCR)}</td><td class="mono">${esc(c.PCF_UNIT)}</td><td>${esc(c.PCF_LDESCR)}</td></tr>`; })), fl.length);
  }
  let right = "";
  for (const [role, title] of GROUPS) {
    const list = ms.filter(m => m.role === role); if (!list.length) continue;
    const by = new Map(); for (const m of list) { if (!by.has(m.scope)) by.set(m.scope, []); by.get(m.scope).push(m); }
    right += sec(title, [...by].map(([sc, arr]) => `<button class="mi" data-go-mid="${arr[0].id}"><span class="mi-loc${isDocScope(sc) ? " doc" : ""}">${scopeIcon(sc)}${esc(SCOPES.get(sc).full)}</span><span class="mi-snip">${snippet(arr[0])}</span>${arr.length > 1 ? `<span class="mi-n">${arr.length} mentions here</span>` : ""}</button>`).join(""), list.length);
  }
  const counts = GROUPS.map(([r, t]) => [t, ms.filter(m => m.role === r).length]).filter(x => x[1]);
  return `<div class="rh"><span class="kind">${T.label} \u00b7 srdb/${T.file}</span><h1 class="mono">${esc(a[T.id])}</h1><span class="sub mono">${esc(a[T.mn] || "")}</span><span class="sub">${esc(a[T.desc] || "")}</span></div>
    <div class="pad"><div class="stats">${counts.map(([t, n]) => `<span class="stat">${t}<b>${n}</b></span>`).join("")}</div>
    <div class="pgrid"><div class="pcol">${left}</div><div class="pcol">${right || `<p class="muted">Not mentioned in any source.</p>`}</div></div></div>`;
}
function renderMain() {
  const mm = state.main, r = $("#reader");
  if (mm.kind === "src") { const s = SRC_BY[mm.id]; r.innerHTML = s.kind === "doc" ? renderDoc(s) : renderCode(s); }
  else if (mm.kind === "table") { tableSort = { col: null, dir: 1 }; r.innerHTML = renderTable(mm.type); }
  else if (mm.kind === "search") r.innerHTML = renderSearch(mm.q || "");
  else if (mm.kind === "diag") r.innerHTML = renderDiag(mm.focus);
  else if (mm.kind === "graph") r.innerHTML = renderGraphMain(mm.type, mm.key);
  else if (mm.kind === "entity") r.innerHTML = renderEntityPage(mm.type, mm.key);
  r.scrollTop = 0;
  let el = null;
  if (mm.mid != null) el = r.querySelector(`[data-mid="${mm.mid}"]`) || r.querySelector(`[data-bad="${mm.mid}"]`);
  else if (mm.unit) el = r.querySelector(`[data-unit="${CSS.escape(mm.unit)}"]`);
  else if (mm.scope) el = r.querySelector(`[data-scope="${CSS.escape(mm.scope)}"]`);
  if (el) {
    el.scrollIntoView({ block: mm.mid != null ? "center" : "start" });
    const t = mm.mid != null ? el : (el.matches(".ln, p, td, h2, h3") ? el : el.querySelector("h2, h3") || el);
    t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1900);
  }
}
function updateCur() {
  document.querySelectorAll("#reader .m.cur").forEach(e => e.classList.remove("cur"));
  if (state.cur != null) { const e = document.querySelector(`#reader [data-mid="${state.cur}"]`); if (e) e.classList.add("cur"); }
  if (state.main.kind === "table") { const tb = $("#tbody"); if (tb) tb.innerHTML = tbodyHTML(state.main.type); applyFilter(); }
}
function render() {
  document.body.classList.toggle("page-mode", state.main.kind === "entity");
  const key = JSON.stringify(state.main);
  if (key !== lastMainKey) { $("#nav").innerHTML = navHTML(); renderMain(); lastMainKey = key; }
  else updateCur();
  renderPanel();
  $("#back").setAttribute("aria-disabled", String(!hist.length));
  $("#fwd").setAttribute("aria-disabled", String(!fut.length));
  if (state.main.kind !== "search" && document.activeElement !== $("#q")) $("#q").value = "";
}
function go(next, push = true) {
  if (push) { hist.push(state); fut.length = 0; }
  state = next; render();
}
function closeNav() { document.body.classList.remove("nav-open"); $("#navtoggle").setAttribute("aria-expanded", "false"); }
function applyFilter() {
  const f = $("#tfilter"); if (!f) return; const q = f.value.trim().toLowerCase();
  document.querySelectorAll("#tbody tr").forEach(tr => { tr.hidden = !!q && !tr.textContent.toLowerCase().includes(q); });
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-bad], tr[data-row-ent]");
  if (!t) return;
  if (t.id === "back") { if (hist.length) { fut.push(state); state = hist.pop(); render(); } return; }
  if (t.id === "fwd") { if (fut.length) { hist.push(state); state = fut.pop(); render(); } return; }
  if (t.id === "pclose") { go({ ...state, ent: null, cur: null }); return; }
  if (t.id === "diagbtn") { go({ ...state, main: { kind: "diag" } }); return; }
  if (t.id === "navtoggle") { const open = document.body.classList.toggle("nav-open"); t.setAttribute("aria-expanded", String(open)); return; }
  if (t.dataset.mid != null && t.closest("#reader")) { const m = M[+t.dataset.mid]; go({ ...state, ent: { type: m.type, key: m.key }, cur: m.id }); return; }
  if (t.dataset.bad != null) { go({ ...state, main: { kind: "diag", focus: +t.dataset.bad } }); return; }
  if (t.dataset.goMid != null) { const m = M[+t.dataset.goMid]; go({ ...state, main: { kind: "src", id: m.src, mid: m.id }, cur: m.id }); return; }
  if (t.dataset.goUnit) { const u = UNITS.find(x => x.unit === t.dataset.goUnit); go({ ...state, main: { kind: "src", id: u.src, unit: u.unit } }); return; }
  if (t.dataset.scopeGo) { const s = SCOPES.get(t.dataset.scopeGo); go({ ...state, main: { kind: "src", id: s.src, scope: s.id } }); return; }
  if (t.dataset.page) { if (state.ent) go({ ...state, main: { kind: "entity", type: state.ent.type, key: state.ent.key } }); return; }
  if (t.dataset.graph) { if (state.ent) go({ ...state, main: { kind: "graph", type: state.ent.type, key: state.ent.key } }); return; }
  if (t.dataset.ent) {
    const [type, key] = t.dataset.ent.split("|");
    const k = state.main.kind, keepKind = (k === "graph" || k === "entity") && t.closest("#reader");
    go({ ...state, ent: { type, key }, cur: null, main: keepKind ? { kind: k, type, key } : state.main }); return;
  }
  if (t.dataset.rowEnt) { const [type, key] = t.dataset.rowEnt.split("|"); go({ ...state, ent: { type, key }, cur: null }); return; }
  if (t.dataset.nav) { closeNav(); go({ ...state, main: JSON.parse(t.dataset.nav) }); return; }
  if (t.dataset.sort) {
    tableSort = { col: t.dataset.sort, dir: tableSort.col === t.dataset.sort ? -tableSort.dir : 1 };
    $("#tbody").innerHTML = tbodyHTML(state.main.type); applyFilter(); return;
  }
});
document.addEventListener("keydown", e => {
  const inField = e.target.matches("input, textarea");
  if (e.key === "/" && !inField) { e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape" && state.ent && !inField) { go({ ...state, ent: null, cur: null }); return; }
  if (e.altKey && e.key === "ArrowLeft") { $("#back").click(); return; }
  if (e.altKey && e.key === "ArrowRight") { $("#fwd").click(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-bad]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "tfilter") { applyFilter(); return; }
  if (e.target.id === "q") {
    const q = e.target.value;
    go({ ...state, main: { kind: "search", q } }, state.main.kind !== "search");
  }
});
narrowMq.addEventListener("change", () => renderPanel());

/* ---------- Start in a realistic working state ---------- */
const nErr = DIAG.filter(d => d.sev === "err").length;
$("#diagbtn").innerHTML = `${nErr ? '<span class="dot err" aria-hidden="true"></span>' : ""}${DIAG.length > nErr ? '<span class="dot warn" aria-hidden="true"></span>' : ""}<span>${DIAG.length} issues</span>`;
const start = M.find(m => m.src === "fop1" && m.role === "sends" && m.key === "PWRC0101");
state = { main: { kind: "src", id: "fop1", mid: start.id }, ent: { type: "CCF", key: "PWRC0101" }, cur: start.id };
render();
})();
</script>
</body>
</html>
