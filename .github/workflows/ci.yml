name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: ty
        run: uv run ty check
      - name: import contracts
        run: uv run lint-imports
      - name: pytest (slow tests run locally before push)
        run: uv run pytest -m "not slow" -n auto

  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # One required check for branch protection, so jobs can change freely.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [python, js]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          [ "${{ needs.python.result }}" = "success" ] && [ "${{ needs.js.result }}" = "success" ]
