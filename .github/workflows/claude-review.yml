name: Claude review

# A second-opinion review of every finished pull request (the pair loop in CLAUDE.md is
# the main review) against the spec and CLAUDE.md, docs-only
# and spec-only pull requests included. Make `review` a required check on main so that
# merges, auto-merge included, wait for it. It comments; it does not fail on findings.
# Drafts and forks skip the job, which GitHub counts as passing.
# Needs one repository secret: ANTHROPIC_API_KEY (API billing) or
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, uses a Claude plan).
# Without either, the job skips.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and pull requests from forks (no secrets there; never run on untrusted code).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: No credentials configured
        if: env.HAS_AUTH != 'true'
        run: echo "::notice::Claude review skipped; add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret."

      - uses: actions/checkout@v4
        if: env.HAS_AUTH == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_AUTH == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request to Mosaic. Read CLAUDE.md first, then the
            slice the PR title names (M<n>.<k>) in plan/M<n>.md, then the diff. The spec is the product:
            docs/spec-0.1.md (cite section numbers), the normative files in spec/, and
            the ADRs in docs/adr/.

            Check, in this order, and only report real problems:
            1. Spec conformance: does the code do what the cited sections say
               (canonical order, hashes, evidence, reading rules, build steps, answers)?
            2. Test integrity: tests weakened, skipped, xfailed or loosened; expected
               values, spec/, docs/, design/, .github/, .claude/ or CLAUDE.md changed
               to make something pass; tests that check the implementation instead of
               the spec's words.
            3. Spec and docs changes (when the PR changes docs/ or spec/): the change says
               what the decision it cites says, no other section or normative file now
               contradicts it, and docs/spec-0.1.md and docs/adr/ stay copies of their
               parts of docs/design.md.
            4. Principles: determinism (ordering, locale, line endings, paths), domain
               words in format/builder/kit, the kit importing Python or the viewer,
               the builder using AI or the network, facts without evidence.
            5. Correctness and security: bugs, unchecked input from files (they are
               untrusted), SQL built from strings, unbounded queries.
            6. The slice's "Done when": is each item actually shown in the PR?
            7. Viewer changes: tokens only (design/), no raw colours or lengths.

            Post each concrete finding as an inline comment on the line, saying what is
            wrong, why (spec section or rule) and what would fix it. Skip style nits that
            ruff, ty, Stylelint or tsc already enforce. Then post one short top-level
            summary: "No blocking issues" or a numbered list of blocking issues.
          # Turns: a large PR's review used 23 (#85) and failed at the old limit of 20, after
          # finishing its review. A required check that fails that way blocks the merge.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
