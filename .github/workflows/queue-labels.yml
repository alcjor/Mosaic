name: Queue labels

# Keeps the work-queue labels true whoever closes an issue or merges a pull request:
# closes issues a merged PR names with "Closes #n", strips in-progress/ready/blocked from
# closed issues, and moves blocked issues whose "Blocked by" list is all closed to ready.
# See scripts/queue_labels.py. Run by hand with workflow_dispatch (dry_run to preview).

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the changes without making them
        type: boolean
        default: false

# One group per event: a single shared group keeps only one pending run and cancels older
# pending ones, which would lose a merged PR's "Closes #n". Every change the script makes is
# idempotent, so runs for different events may overlap.
concurrency:
  group: queue-labels-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  labels:
    # Only PRs merged into the default branch close issues; forks get no write token anyway.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Update labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run --no-project --python 3.14 python scripts/queue_labels.py $DRY_RUN
