name: Queue labels

# Keeps the work-queue labels true whoever closes an issue or merges a pull request:
# closes issues a merged PR names with "Closes #n", strips in-progress/ready/blocked from
# closed issues, and moves blocked issues whose "Blocked by" list is all closed to ready.
# See scripts/queue_labels.py. Run by hand with workflow_dispatch (dry_run to preview).

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the changes without making them
        type: boolean
        default: false

concurrency:
  group: queue-labels
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  labels:
    # Unmerged closed PRs change nothing; forks get no write token anyway.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Update labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: uv run --no-project --python 3.14 python scripts/queue_labels.py $DRY_RUN
