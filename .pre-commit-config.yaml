repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: (^|/)pyproject\.toml$|^uv\.lock$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(examples/|packages/mosaic-server/src/mosaic_server/viewer/)
      - id: check-added-large-files
        args: [--maxkb=2048]
