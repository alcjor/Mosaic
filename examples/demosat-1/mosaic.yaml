# DEMOSAT-1 mock mission, generated by mosaic-mock 0.1.0.
# Everything here is invented. Build it with: mosaic build mosaic.yaml
pack: spacecraft
project: DEMOSAT-1
output: build/demosat-1.mosaic.sqlite
sources:
  srdb: {path: srdb/, options: {icd_issue: "7.0", custom_columns: {pcf: [PCF_LDESCR]}}}
  icd: {path: icd/scsw_icd.html}
  sum: {path: [sum/sum.docx, sum/sum.pdf]}
  code: {path: scsw/, include: ["**/*.c", "**/*.h"]}
  fops: {path: fops/, include: ["**/*.py"]}
xref_maps:
  code-file-documented-in:
    - {from: {source: code, path_glob: src/pwr_app.c}, to: {source: sum, heading_regex: '^4 Power application'}}
    - {from: {source: code, path_glob: src/tcs_app.c}, to: {source: sum, heading_regex: '^5 Thermal control application'}}
    - {from: {source: code, path_glob: src/aoc_app.c}, to: {source: sum, heading_regex: '^6 Attitude and orbit control application'}}
    - {from: {source: code, path_glob: src/obc_app.c}, to: {source: sum, heading_regex: '^7 On-board computer application'}}
    - {from: {source: code, path_glob: src/com_app.c}, to: {source: sum, heading_regex: '^8 Communications application'}}
    - {from: {source: code, path_glob: src/pld_app.c}, to: {source: sum, heading_regex: '^9 Payload application'}}
