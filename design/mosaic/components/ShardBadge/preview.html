<div style="background: var(--surface); padding: 22px 24px; display: flex; gap: 18px; align-items: center">

  <svg width="30" height="30" viewBox="0 0 30 30" role="img" aria-label="Step 2"><polygon class="badge-brand" points="1,9 15,1 29,7 26,26 6,29"></polygon><text class="badge-num" x="15" y="20" text-anchor="middle" font-size="13">2</text></svg>
