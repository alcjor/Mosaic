<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .check { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .check-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .check-list li { display: flex; gap: 8px; align-items: flex-start; }
</style>
<div style="font-family: var(--font-sans); background: var(--surface); padding: 16px 24px">
  <section style="background: var(--surface-tint); color: var(--ink); border-radius: var(--radius-md); padding: 14px 16px; max-width: 340px; display: flex; flex-direction: column; gap: 6px">
    <h3 class="panel-title" style="margin: 0 0 2px 0; color: var(--heading)">Retrofit, not rebuild</h3>
    <ul class="check-list body-print">
      <li><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><polyline class="check" points="2,7.5 5.5,11 12,3"></polyline></svg><span><strong>No rebuild:</strong> works on existing missions, at any stage.</span></li>
      <li><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><polyline class="check" points="2,7.5 5.5,11 12,3"></polyline></svg><span><strong>No re-entry:</strong> data stays where it is; its structure is recovered.</span></li>
      <li><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><polyline class="check" points="2,7.5 5.5,11 12,3"></polyline></svg><span><strong>No new licences:</strong> open source, built on tools we already have.</span></li>
    </ul>
    <p class="caption" style="margin: 4px 0 0 0; color: var(--ink-muted)">A step towards the MBSE and PLM tools being adopted.</p>
  </section>
</div>
