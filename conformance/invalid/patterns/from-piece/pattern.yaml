# Invalid: Group is mapped from sets, which is not a listed piece (section 5.6).
format: "0.1"
pieces:
  - rows@0123abcd
types:
  Item:
    key: code
    from:
      rows.Row: {code: key}
  Group:
    key: name
    describe: A set of items
    from:
      sets.Set: {name: label}
edges:
  member:
    from: Item
    to: Group
    map: [rows.in_set]
mosaics:
  all: {}
  items: {types: [Item]}
