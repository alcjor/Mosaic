# Invalid: the piece is not pinned by a hash (section 5, pattern.schema.json).
format: "0.1"
pieces:
  - rows
types:
  Item:
    key: code
    from:
      rows.Row: {code: key}
  Group:
    key: name
    describe: A set of items
    from:
      rows.Set: {name: label}
edges:
  member:
    from: Item
    to: Group
    map: [rows.in_set]
mosaics:
  all: {}
  items: {types: [Item]}
