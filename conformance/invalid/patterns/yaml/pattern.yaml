# Invalid: a flow sequence is never closed (section 5: read as YAML 1.2).
format: "0.1"
pieces:
  - rows@0123abcd
types:
  Item:
    key: code
    from:
      rows.Row: {code: key}
  Group:
    key: name
    describe: A set of items
    from:
      rows.Set: {name: label}
edges:
  member:
    from: Item
    to: Group
    map: [rows.in_set
mosaics:
  all: {}
  items: {types: [Item]}
