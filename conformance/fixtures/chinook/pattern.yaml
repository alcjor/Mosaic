# Pattern for the Chinook fixture (docs/spec-0.1.md section 11; plan M3.3).
# The piece is the tessera that settings.yaml makes from the pinned Chinook_Sqlite.sqlite.
format: "0.1"
pieces:
  - chinook@5ce2d900bdcedf48246fdbdb39bc220f91e346a87c7a89842106ad02390dc350

types:
  Artist:
    key: artist_id
    describe: A performer or band whose albums are in the catalogue
    from:
      chinook.Artist: {artist_id: key, name: Name}
  Album:
    key: album_id
    describe: An album by one artist
    from:
      chinook.Album: {album_id: key, title: Title}
  Track:
    key: track_id
    describe: A track on an album, with its composer, length, size and price
    from:
      chinook.Track:
        track_id: key
        name: Name
        composer: Composer
        milliseconds: Milliseconds
        bytes: Bytes
        unit_price: UnitPrice
  Genre:
    key: genre_id
    describe: A musical genre a track belongs to
    from:
      chinook.Genre: {genre_id: key, name: Name}
  MediaType:
    key: media_type_id
    describe: The file format a track is sold in
    from:
      chinook.MediaType: {media_type_id: key, name: Name}
  Playlist:
    key: playlist_id
    describe: A named list of tracks
    from:
      chinook.Playlist: {playlist_id: key, name: Name}
  Employee:
    key: employee_id
    describe: A member of staff, with the manager they report to
    from:
      chinook.Employee:
        employee_id: key
        first_name: FirstName
        last_name: LastName
        title: Title
        city: City
        country: Country
        hire_date: HireDate
  Customer:
    key: customer_id
    describe: A customer and the member of staff who supports them
    from:
      chinook.Customer:
        customer_id: key
        first_name: FirstName
        last_name: LastName
        company: Company
        city: City
        country: Country

edges:
  by:
    from: Album
    to: Artist
    map: [chinook.by]
  on_album:
    from: Track
    to: Album
    map: [chinook.on_album]
  in_genre:
    from: Track
    to: Genre
    map: [chinook.in_genre]
  encoded_as:
    from: Track
    to: MediaType
    map: [chinook.encoded_as]
  contains:
    from: Playlist
    to: Track
    map: [chinook.contains]
  reports_to:
    from: Employee
    to: Employee
    map: [chinook.reports_to]
  supported_by:
    from: Customer
    to: Employee
    map: [chinook.supported_by]
