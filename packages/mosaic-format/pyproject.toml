[project]
name = "mosaic-format"
version = "0.0.0"
description = "Mosaic file format: schema, hashes and the conformance checker (mosaic check)."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.23",
    "ruamel-yaml>=0.18",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic_format"]

# The five normative files of the repository's spec/ ship inside the package as
# mosaic_format/spec/ (see hatch_build.py).
[tool.hatch.build.hooks.custom]
