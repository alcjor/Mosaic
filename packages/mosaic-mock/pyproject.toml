[project]
name = "mosaic-mock"
version = "0.1.0"
description = "Mosaic mocker: invented systems with ground truth and injected defects"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "jinja2>=3.1",
    "python-docx>=1.1",
    "reportlab>=4",
    "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]

[project.scripts]
mosaic-mock = "mosaic_mock.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
