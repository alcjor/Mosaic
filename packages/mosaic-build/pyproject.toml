[project]
name = "mosaic-build"
version = "0.0.0"
description = "Mosaic tessera builders, mosaic builder and the `mosaic` command line."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["mosaic-format", "numpy>=2.3", "onnxruntime>=1.23", "tokenizers>=0.22"]

[project.scripts]
mosaic = "mosaic_build.cli:main"

[tool.uv.sources]
mosaic-format = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic_build"]
